<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ThermoScan  Termovízne merania budov</title>
  <desc id="desc">Tmavomodrá grafika s oran~ovou tepelnou akálou a názvom ThermoScan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#132a38"/>
    </linearGradient>
    <radialGradient id="heat">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#d84228" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d84228" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1010" cy="130" r="390" fill="url(#heat)"/>
  <circle cx="940" cy="560" r="280" fill="url(#heat)" opacity=".55"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="12">
    <path d="M108 265V145l92-75 92 75v120"/>
    <rect x="153" y="113" width="42" height="112" rx="21"/>
    <circle cx="174" cy="210" r="28" fill="#ff7a1a" stroke="none"/>
  </g>
  <text x="350" y="250" fill="#fff" font-family="Arial, sans-serif" font-size="92" font-weight="700">THERMOSCAN</text>
  <text x="352" y="330" fill="#ff9a58" font-family="Arial, sans-serif" font-size="42" font-weight="600">Termovízne merania budov</text>
  <text x="352" y="400" fill="#c4d0d8" font-family="Arial, sans-serif" font-size="30">Odha>te tepelné úniky a skryté nedostatky</text>
  <text x="352" y="447" fill="#c4d0d8" font-family="Arial, sans-serif" font-size="30">Nitra a okolie</text>
</svg>
